name: Compilar escritorio

# Se dispara al publicar una etiqueta (v1.0.0, v1.1.0...) y también a mano
# desde la pestaña Actions, para poder probar sin publicar una versión.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release

jobs:
  compilar:
    strategy:
      fail-fast: false # que un sistema roto no cancele el build del otro
      matrix:
        include:
          - os: windows-latest
            nombre: Cenit-windows.exe
            binario: dist/Cenit.exe
          - os: ubuntu-latest
            nombre: Cenit-linux
            binario: dist/Cenit

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El Python de setup-python trae _tkinter, pero enlazado contra las
      # librerías de Tcl/Tk del sistema, que en el runner no vienen. xvfb es
      # una pantalla virtual: sin ella no se puede arrancar una app gráfica
      # para probarla.
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # --collect-all customtkinter: la librería carga sus temas desde
      #   archivos .json que PyInstaller no detecta solo.
      # --collect-data plotly: plotly.js va como dato del paquete y sin él
      #   el globo se genera vacío.
      - name: Compilar
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Cenit
          --collect-all customtkinter
          --collect-data plotly
          main.py

      # No basta con que el binario exista: lo que rompe de verdad es que
      # falte un import y muera al arrancar. Se lanza de verdad y se
      # comprueba que siga vivo a los 20 segundos.
      - name: Prueba de arranque (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          xvfb-run -a timeout 20 ${{ matrix.binario }}
          codigo=$?
          set -e
          if [ $codigo -ne 124 ]; then
            echo "::error::La app se cerró sola con código $codigo en vez de seguir corriendo."
            exit 1
          fi
          echo "Sigue viva a los 20 s."

      - name: Prueba de arranque (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "${{ matrix.binario }}" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Host "::error::La app se cerró sola con código $($p.ExitCode)."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Sigue viva a los 20 s."

      - name: Renombrar
        shell: bash
        run: mv "${{ matrix.binario }}" "${{ matrix.nombre }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}

  publicar:
    # Solo cuando se etiqueta una versión; las ejecuciones manuales se quedan
    # en artefactos descargables desde la pestaña Actions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Cenit ${{ github.ref_name }}" \
            --generate-notes \
            artefactos/*
